services:
  postgres:
    image: postgres:16
    container_name: fullstack-journey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey_password
      POSTGRES_DB: journey
    ports:
      - "5433:5432"
    volumes:
      - journey_pgdata:/var/lib/postgresql/data
volumes:
  journey_pgdata:
